
{% extends "students/base.html" %}

{% block title %}Session Demo{% endblock %}

{% block content %}

<h2>Django Session Demo</h2>

<p>You have visited this page:</p>

<h1>{{ visit_count }} times</h1>
<h1>{{ session_name }}</h1>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Reset Counter</button>
</form>

{% endblock %}
